name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master

jobs:
  docker:
    name: Build & Push Docker Image to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Docker Hub credentials are not configured."
            exit 1
          fi
          TOKEN="$(printf '%s' "$DOCKERHUB_TOKEN" | tr -d '\r\n')"
          printf '%s' "$TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            darshan190607/ai365-cce:latest
            darshan190607/ai365-cce:${{ github.sha }}
